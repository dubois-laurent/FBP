name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "24"

# ── LINT ──────────────────────────────────────────────────────────────────────

jobs:
  lint-backend:
    name: "lint: backend"
  lint-backend:
    name: "lint: backend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter backend exec tsc --noEmit --project tsconfig.json

  lint-frontend:
    name: "lint: frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter frontend exec tsc --noEmit

# ── TEST ──────────────────────────────────────────────────────────────────────

  test-backend:
    name: "test: backend"
    runs-on: ubuntu-latest
    needs: [lint-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm --filter backend test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/fbp_test
          JWT_ACCESS_SECRET: test_access_secret_min_32_characters_long
          JWT_REFRESH_SECRET: test_refresh_secret_min_32_characters_long
          GOOGLE_CLIENT_ID: test_google_client_id
          GOOGLE_CLIENT_SECRET: test_google_client_secret
          GOOGLE_CALLBACK_URL: http://localhost:3000/auth/google/callback
          FRONTEND_URL: http://localhost:5173

  test-frontend:
    name: "test: frontend"
  test-frontend:
    name: "test: frontend"
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    needs: [lint-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm --filter frontend test

# ── BUILD ─────────────────────────────────────────────────────────────────────

  build:
    name: "build: frontend"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm --filter frontend exec vite build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist
          retention-days: 7
